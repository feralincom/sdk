[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feralin"
version = "0.1.0"
description = "Feralin UTP v1 server SDK (Python) — yalnız standart kütüphane, consent-first, at-least-once batch gönderimi"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 lisans ifadesi (setuptools 77+); lisans sınıflandırıcısıyla birlikte kullanılamaz.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Feralin" }]
keywords = ["analytics", "attribution", "feralin", "utp", "events"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Dış bağımlılık yok: urllib, threading, json, secrets ile yetinilir.
dependencies = []

[project.urls]
Homepage = "https://feralin.com"
Repository = "https://github.com/feralincom/sdk"
Documentation = "https://github.com/feralincom/sdk/blob/main/docs/sdk/python.md"
Changelog = "https://github.com/feralincom/sdk/blob/main/sdks/python/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feralin = ["py.typed"]
