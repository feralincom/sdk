[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feralin"
version = "0.1.0"
description = "Feralin UTP v1 server SDK (Python) — yalnız standart kütüphane, consent-first, at-least-once batch gönderimi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Feralin" }]
keywords = ["analytics", "attribution", "feralin", "utp", "events"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Dış bağımlılık yok: urllib, threading, json, secrets ile yetinilir.
dependencies = []

[project.urls]
Documentation = "https://github.com/feralin"  # PyPI yayını ve kalıcı repo adresi henüz yok (BLOCKED_EXTERNAL)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feralin = ["py.typed"]
