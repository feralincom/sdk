[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feralin-django"
version = "0.1.0"
description = "Feralin Python SDK için Django ara katmanı: istek başına izin ve kimlik geçirme"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Feralin" }]
keywords = ["analytics", "attribution", "feralin", "django"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["feralin>=0.1,<0.2", "django>=4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feralin_django = ["py.typed"]
