[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feralin-django"
version = "0.1.0"
description = "Feralin Python SDK için Django ara katmanı: istek başına izin ve kimlik geçirme"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 lisans ifadesi (setuptools 77+); lisans sınıflandırıcısıyla birlikte kullanılamaz.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Feralin" }]
keywords = ["analytics", "attribution", "feralin", "django"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["feralin>=0.1,<0.2", "django>=4.2"]

[project.urls]
Homepage = "https://feralin.com"
Repository = "https://github.com/feralincom/sdk"
Documentation = "https://github.com/feralincom/sdk/blob/main/docs/sdk/python-django.md"
Changelog = "https://github.com/feralincom/sdk/blob/main/sdks/python-django/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feralin_django = ["py.typed"]
