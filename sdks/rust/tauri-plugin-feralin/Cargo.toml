[package]
name = "tauri-plugin-feralin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Tauri 2 eklentisi: webview'den feralin crate'ine izin kapılı olay köprüsü"
license = "MIT"
links = "tauri-plugin-feralin"

[dependencies]
feralin = { version = "0.1.0", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
